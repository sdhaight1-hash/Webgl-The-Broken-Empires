name: Audit local hyperlinked PDF export
# One end-to-end reflow gate against the original Git LFS rulebook
on:
  push:
    branches: [feature/structured-srd-layout-tables]
    paths: [.github/workflows/srd-export-audit.yml]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: node --experimental-strip-types scripts/audit-srd-export.mjs
