name: Temporary late chapter rule audit
on:
  push:
    branches: [feature/full-rulebook-index]
    paths: [scripts/_tmp_late_review.py, .github/workflows/_tmp_late_review.yml]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pymupdf==1.26.5
      - run: python scripts/_tmp_late_review.py
