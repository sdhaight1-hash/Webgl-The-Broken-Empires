name: Temporary numerical solo odds audit
on:
  push:
    branches: [feature/solo-play-vtt-phase1]
    paths: [scripts/_tmp_solo_numeric.py,.github/workflows/_tmp_solo_numeric.yml]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pymupdf==1.26.5
      - run: python scripts/_tmp_solo_numeric.py
