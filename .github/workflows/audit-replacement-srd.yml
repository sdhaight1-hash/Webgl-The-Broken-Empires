name: Compare replacement SRD against the original core rulebook
on:
  push:
    branches: [feature/empire-dark-cohesive-sheets-and-srd-audit]
    paths: [scripts/audit-replacement-srd.py,.github/workflows/audit-replacement-srd.yml]
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install pymupdf==1.26.5
      - run: node --experimental-strip-types --input-type=module -e "import {TALENT_CATALOG} from './src/talentCatalog.ts';import fs from 'node:fs';fs.writeFileSync('/tmp/tbe_talent_names.json',JSON.stringify(TALENT_CATALOG))"
      - run: python scripts/audit-replacement-srd.py
