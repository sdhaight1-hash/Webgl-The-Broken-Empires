name: Temporary export lockfile refresh
on:
  push:
    branches: [feature/export-hyperlinked-personal-srd-pdf]
    paths: [.github/workflows/_temp_export_lock.yml]
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: node -e 'const fs=require("fs");console.log("LOCK_B64_BEGIN"+fs.readFileSync("package-lock.json").toString("base64")+"LOCK_B64_END")'
