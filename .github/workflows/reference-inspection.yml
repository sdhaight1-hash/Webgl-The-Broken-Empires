name: Inspect locally supplied reference assets
on:
  push:
    branches: [feature/source-reference-workbench]
    paths: ['scripts/inspect_references.py', '.github/workflows/reference-inspection.yml', 'ref docs/**']
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pymupdf==1.26.5
      - run: python scripts/inspect_references.py
