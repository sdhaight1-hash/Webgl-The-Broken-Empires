name: Temporary whole-book text reconstruction audit
on:
  push:
    branches: [feature/local-text-first-srd]
    paths: [scripts/_tmp_pdf_srd_audit.mjs,.github/workflows/_tmp_pdf_srd_audit.yml]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: node --experimental-strip-types scripts/_tmp_pdf_srd_audit.mjs
