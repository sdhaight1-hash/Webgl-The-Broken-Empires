name: Sample uploaded SRD against Git LFS core book
on:
  push:
    branches: [audit/srd-source-sample-2026]
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pymupdf==1.26.5
      - run: python scripts/audit-uploaded-srd-sample.py
