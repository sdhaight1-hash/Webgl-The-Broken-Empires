name: Temporary PDF codex review
on:
  push:
    branches: [feature/pdf-grounded-codex]
    paths: ['scripts/_temporary_pdf_codex_review.py','.github/workflows/_temporary_pdf_codex_review.yml']
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [basics, characters, play, magic]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pymupdf==1.26.5
      - run: python scripts/_temporary_pdf_codex_review.py ${{ matrix.group }}
