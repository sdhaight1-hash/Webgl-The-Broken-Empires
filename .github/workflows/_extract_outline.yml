name: Extract rulebook outline metadata
on:
  push:
    branches: [feature/full-rulebook-index]
    paths: [scripts/_extract_outline.py, .github/workflows/_extract_outline.yml]
  workflow_dispatch:
jobs:
  outline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pymupdf==1.26.5
      - run: python scripts/_extract_outline.py
